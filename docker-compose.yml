services:
  postgres:
    image: postgres:18.3-alpine
    container_name: food-delivery-db
    restart: unless-stopped
    ports:
      - "${DATABASE_LOCAL_PORT}:5432"
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql
    command: postgres -c 'max_connections=200'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: development
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
    container_name: food-delivery-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    environment:
      - DATABASE_URL=postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:${DATABASE_PORT}/${DATABASE_NAME}?schema=public&connection_limit=50&pool_timeout=20
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
